<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Conversor de ubicaciones a bins</title>
<style>
  :root{
    --bg:#F4F1EA;
    --panel:#FFFFFF;
    --ink:#1E1D1B;
    --sub:#6B6862;
    --line:#E2DED3;
    --accent:#0F6E56;
    --accent-dark:#085041;
    --warn:#993C1D;
    --warn-bg:#FAECE7;
    --mono: 'JetBrains Mono','Courier New',monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    padding:40px 16px;
    display:flex;
    justify-content:center;
  }
  .wrap{max-width:480px;width:100%;}
  h1{
    font-size:20px;
    font-weight:600;
    margin:0 0 20px;
    letter-spacing:-0.01em;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:22px;
  }
  .wh-options{display:flex;gap:8px;margin-bottom:18px;}
  .wh-btn{
    flex:1;
    padding:10px;
    border:1.5px solid var(--line);
    border-radius:8px;
    background:#FBFAF6;
    cursor:pointer;
    text-align:center;
    font-size:13.5px;
    font-weight:500;
    transition:border-color .12s, background .12s;
  }
  .wh-btn:hover{border-color:#C9C3B2;}
  .wh-btn.selected{
    border-color:var(--accent);
    background:#E1F5EE;
    color:var(--accent-dark);
  }
  textarea{
    width:100%;
    min-height:160px;
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:12px;
    font-family:var(--mono);
    font-size:13px;
    line-height:1.6;
    resize:vertical;
    background:#FBFAF6;
    color:var(--ink);
  }
  textarea:focus{outline:none;border-color:var(--accent);}
  button.primary{
    width:100%;
    margin-top:14px;
    padding:12px;
    border:none;
    border-radius:8px;
    background:var(--accent);
    color:#fff;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:background .12s;
  }
  button.primary:hover{background:var(--accent-dark);}
  .status{
    margin-top:14px;
    font-size:13px;
    color:var(--sub);
    text-align:center;
  }
  .warn-box{
    margin-top:14px;
    background:var(--warn-bg);
    border:1px solid #F0997B;
    border-radius:8px;
    padding:10px 12px;
    font-size:12.5px;
    color:var(--warn);
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Conversor de ubicaciones a bins</h1>

  <div class="card">
    <div class="wh-options" id="whOptions">
      <div class="wh-btn selected" data-wh="ws">General / Wholesale</div>
      <div class="wh-btn" data-wh="ecomm">Ecommerce</div>
    </div>

    <textarea id="locInput" placeholder="2-L-11-2&#10;3-A-4-1&#10;1-C-9-0"></textarea>

    <button class="primary" id="genBtn">Generar y descargar CSV</button>
    <div class="status" id="status"></div>
    <div id="warnBoxHolder"></div>
  </div>
</div>

let selectedWh = 'ws';
document.getElementById('whOptions').addEventListener('click', (e) => {
  const btn = e.target.closest('.wh-btn');
  if(!btn) return;
  document.querySelectorAll('.wh-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedWh = btn.dataset.wh;
});

function parseLocation(raw){
  const parts = raw.trim().split('-').map(p=>p.trim()).filter(p=>p.length>0);
  if(parts.length === 4){
    return {zone:parts[0], aisle:parts[1], bay:parts[2], shelf:parts[3]};
  } else if(parts.length === 3){
    return {zone:'1', aisle:parts[0], bay:parts[1], shelf:parts[2]};
  }
  return null;
}

document.getElementById('genBtn').addEventListener('click', () => {
  const raw = document.getElementById('locInput').value;
  const lines = raw.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  const warehouseLabel = selectedWh === 'ws' ? 'General / Wholesale' : 'Ecommerce';
  const table = LOOKUP[selectedWh];

  const rows = [];
  const notFound = [];
  const invalid = [];

  lines.forEach(loc => {
    const hasStar = loc.startsWith('*');
    const cleanLoc = hasStar ? loc.slice(1) : loc;
    const parsed = parseLocation(cleanLoc);
    if(!parsed){
      invalid.push(loc);
      return;
    }
    const pickSeq = Object.prototype.hasOwnProperty.call(table, cleanLoc) ? table[cleanLoc] : null;
    if(pickSeq === null) notFound.push(loc);
    for(let n=1; n<=18; n++){
      const name = loc + '-' + n;
      rows.push([
        '', warehouseLabel, parsed.zone, parsed.aisle, parsed.bay, parsed.shelf,
        name, name, 'PICK', false, pickSeq === null ? '' : pickSeq
      ]);
    }
  });

  const statusEl = document.getElementById('status');
  const warnHolder = document.getElementById('warnBoxHolder');
  warnHolder.innerHTML = '';

  if(rows.length === 0){
    statusEl.textContent = 'No hay ubicaciones para procesar.';
    return;
  }

  statusEl.textContent = lines.length + ' ubicaciones · ' + rows.length + ' filas generadas';

  if(notFound.length > 0 || invalid.length > 0){
    let html = '<div class="warn-box">';
    if(notFound.length > 0) html += 'Sin PickSequence: ' + notFound.join(', ') + '<br>';
    if(invalid.length > 0) html += 'Formato no reconocido: ' + invalid.join(', ');
    html += '</div>';
    warnHolder.innerHTML = html;
  }

  const headers = ['INTERNAL_LOCATION_ID','Warehouse','Zone','Aisle','Bay','Shelf','LocationName','SimpleLocationName','LocationType','ExcludeVerificationWhenPicking','PickSequence'];
  const data = [headers, ...rows];

  const csvEscape = (v) => {
    const s = String(v);
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  };
  const csv = data.map(row => row.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Locations_' + lines[0] + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
